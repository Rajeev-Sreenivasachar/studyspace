<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Review all 46 AP Human Geography Unit 1 vocabulary entries in one searchable grid."><title>APHG Unit 1 Vocabulary Review | StudySpace</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div data-nav data-back="aphg.html"></div><main id="main"><header class="page-head"><div class="eyebrow">AP Human Geography • Unit 1</div><h1>Vocabulary <span class="gradient-text">Review</span></h1><p class="lead">All 46 teacher-assigned numbered entries, including the intentional #41 duplicate, with examples and clearly labeled StudySpace explanations.</p><div class="actions"><a class="btn" href="aphg.html">← Unit dashboard</a><a class="btn primary" href="aphg-quiz.html">Test yourself</a></div></header><section><div class="flash-filters"><label>Search<input class="search" id="vocabSearch" type="search" placeholder="Search terms or definitions…"></label><label>Topic<select id="vocabTopic"><option value="all">All topics</option></select></label></div><p class="muted" id="vocabCount" aria-live="polite"></p><div class="study-grid" id="studyGrid"></div></section></main><div data-footer></div></div><script src="assets/data/aphg-unit1.js"></script><script src="assets/studyspace-core.js"></script><script src="app.js?v=15"></script><script>const unit=APHG_UNIT1,app=StudySpace,grid=document.querySelector('#studyGrid'),search=document.querySelector('#vocabSearch'),topic=document.querySelector('#vocabTopic'),count=document.querySelector('#vocabCount');unit.topics.forEach(item=>topic.insertAdjacentHTML('beforeend',`<option value="${item.id}">${item.id} ${app.escapeHtml(item.title)}</option>`));const initial=new URLSearchParams(location.search).get('term');if(initial){const found=unit.vocabulary.find(term=>term.id===initial);if(found)search.value=found.term;}function render(){const q=search.value.trim().toLowerCase();const terms=unit.vocabulary.filter(term=>(topic.value==='all'||term.topic===topic.value)&&(!q||`${term.term} ${term.definition} ${term.example}`.toLowerCase().includes(q)));grid.innerHTML=terms.map(term=>`<article class="term"><div class="term-num">ASSIGNMENT ${term.number} · TOPIC ${term.topic}</div><h3>${app.escapeHtml(term.term)}</h3><p>${app.escapeHtml(term.definition)}</p><p class="simple-explanation"><strong>StudySpace explanation:</strong> ${app.escapeHtml(term.simpleExplanation)}</p><p class="example"><strong>Example:</strong> ${app.escapeHtml(term.example)}</p><div class="hook">Memory hook: ${app.escapeHtml(term.hook)}</div></article>`).join('')||'<div class="empty-state panel"><h3>No matching vocabulary</h3><p class="muted">Try another term or topic.</p></div>';count.textContent=`${terms.length} of ${unit.vocabulary.length} verified entries`;}search.oninput=render;topic.onchange=render;render();</script></body></html>
