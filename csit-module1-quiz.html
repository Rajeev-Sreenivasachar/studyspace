<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSIT Module 1 Practice Quiz | StudySpace</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div data-nav data-back="csit-module1.html"></div><main id="main"><header class="page-head"><div class="eyebrow">CSIT Essentials • Module 1</div><h1>Hardware Practice <span class="gradient-text">Quiz</span></h1><p class="lead">15 original study questions selected from a bank of more than 50. Every retry reshuffles the questions and choices.</p></header><div class="quiz-shell" id="quizShell"></div></main><div data-footer></div></div><script src="csit-data.js"></script><script src="app.js"></script><script>
let questions=[],current=0,score=0,answered=false;const shell=document.querySelector("#quizShell");function shuffle(a){const b=[...a];for(let i=b.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function makeChoices(q){const wrong=shuffle(CSIT_QUIZ.filter(x=>x.index!==q.index).map(x=>x.answer)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);return shuffle([q.answer,...wrong])}function startQuiz(){questions=shuffle(CSIT_QUIZ).slice(0,15).map(q=>({...q,choices:makeChoices(q)}));current=score=0;render()}function render(){answered=false;const q=questions[current];shell.innerHTML=`<div class="quiz-card"><div class="quiz-top"><span>Question ${current+1} of 15</span><strong>Score: ${score}</strong></div><div class="eyebrow">Choose the best answer</div><h2>${q.question}</h2><div class="choices">${q.choices.map((x,i)=>`<button class="btn choice" data-i="${i}">${x}</button>`).join("")}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn primary" id="continue" hidden>${current===14?"See results":"Next question →"}</button></div>`;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.querySelector("#continue").onclick=()=>{current++;current===15?finish():render()}}function answer(i){if(answered)return;answered=true;const q=questions[current],picked=q.choices[i],ok=picked===q.answer;if(ok)score++;document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.answer)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});const f=document.querySelector("#feedback");f.className=`feedback ${ok?"good":"bad"}`;f.textContent=ok?"Correct—nice work!":`Not quite. ${q.answer}`;document.querySelector("#continue").hidden=false}function finish(){const pct=Math.round(score/15*100);shell.innerHTML=`<div class="quiz-card empty-state"><div class="eyebrow">Quiz complete</div><h2>${pct}%</h2><p class="lead">You answered ${score} of 15 correctly. ${pct>=80?"Strong hardware knowledge!":pct>=60?"Good progress—review the concepts you missed.":"Run through the flashcards, then take a fresh attempt."}</p><div class="actions" style="justify-content:center"><button class="btn primary" id="retry">Retry randomized quiz</button><a class="btn" href="csit-module1-flashcards.html">Review flashcards</a></div></div>`;document.querySelector("#retry").onclick=startQuiz}startQuiz();
</script></body></html>
