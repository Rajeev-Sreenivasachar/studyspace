<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSIT Module 1 Flashcards | StudySpace</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div data-nav data-back="csit-module1.html"></div><main id="main"><header class="page-head"><div class="eyebrow">CSIT Essentials • Module 1</div><h1>Hardware <span class="gradient-text">Flashcards</span></h1><p class="lead">60 exam-worthy safety numbers, component differences, and hardware concepts. Click the card or press Enter to flip it.</p></header><div class="flash-area"><div class="stats"><div class="stat"><strong id="progress">1 / 60</strong><span>Progress</span></div><div class="stat"><strong id="mastered">0</strong><span>Mastered</span></div><div class="stat"><strong id="review">0</strong><span>Review</span></div><div class="stat"><strong id="remaining">60</strong><span>Unsorted</span></div></div><button class="flashcard" id="flashcard" aria-label="CSIT flashcard. Activate to flip"><span class="flash-inner"><span class="flash-face"><span class="eyebrow" id="cardLabel">Card 1</span><h2 id="cardFront"></h2><span class="flash-hint">Tap to reveal the answer</span></span><span class="flash-face flash-back"><span class="eyebrow">Answer</span><p id="cardBack"></p><span class="flash-hint">Tap to see the question</span></span></span></button><div class="flash-controls"><button class="btn" id="prev">← Previous</button><button class="btn" id="again">Study Again</button><button class="btn primary" id="know">I Know This</button><button class="btn" id="next">Next →</button></div><div class="flash-controls"><button class="btn small" id="shuffle">↻ Shuffle</button><button class="btn small" id="reset">Reset progress</button><a class="btn small" href="csit-module1-quiz.html">⚡ Practice quiz</a></div></div></main><div data-footer></div></div><script src="csit-data.js"></script><script src="app.js?v=13"></script><script>
let deck=CSIT_CARDS.slice(0,60).map((x,i)=>({...x,id:i})),index=0;const mastered=new Set,review=new Set,card=document.querySelector("#flashcard");function render(){const x=deck[index];card.classList.remove("flipped");document.querySelector("#cardLabel").textContent=`Card ${index+1}`;document.querySelector("#cardFront").textContent=x.front;document.querySelector("#cardBack").textContent=x.back;document.querySelector("#progress").textContent=`${index+1} / ${deck.length}`;document.querySelector("#mastered").textContent=mastered.size;document.querySelector("#review").textContent=review.size;document.querySelector("#remaining").textContent=deck.length-new Set([...mastered,...review]).size}function move(n){index=(index+n+deck.length)%deck.length;render()}card.onclick=()=>card.classList.toggle("flipped");document.querySelector("#prev").onclick=()=>move(-1);document.querySelector("#next").onclick=()=>move(1);document.querySelector("#know").onclick=()=>{mastered.add(deck[index].id);review.delete(deck[index].id);move(1)};document.querySelector("#again").onclick=()=>{review.add(deck[index].id);mastered.delete(deck[index].id);move(1)};document.querySelector("#shuffle").onclick=()=>{for(let i=deck.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;render()};document.querySelector("#reset").onclick=()=>{mastered.clear();review.clear();index=0;render()};render();
</script></body></html>
