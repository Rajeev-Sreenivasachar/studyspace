<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APHG Unit 1 Flashcards | StudySpace</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div data-nav data-back="aphg.html"></div><main id="main"><header class="page-head"><div class="eyebrow">AP Human Geography • Unit 1</div><h1>Vocab <span class="gradient-text">Flashcards</span></h1><p class="lead">Tap or press Enter to flip. Sort each card, shuffle the deck, or switch to quiz mode when you’re ready.</p></header><div class="flash-area"><div class="stats"><div class="stat"><strong id="progress">1 / 17</strong><span>Progress</span></div><div class="stat"><strong id="mastered">0</strong><span>Mastered</span></div><div class="stat"><strong id="review">0</strong><span>Review</span></div><div class="stat"><strong id="remaining">17</strong><span>Unsorted</span></div></div><button class="flashcard" id="flashcard" aria-label="Flashcard. Activate to flip"><span class="flash-inner"><span class="flash-face"><span class="eyebrow" id="cardLabel">Term 1</span><h2 id="cardTerm"></h2><span class="flash-hint">Tap to reveal definition</span></span><span class="flash-face flash-back"><span class="eyebrow">Definition</span><p id="cardDefinition"></p><p class="example" id="cardExample"></p><strong class="hook" id="cardHook"></strong><span class="flash-hint">Tap to see term</span></span></span></button><div class="flash-controls"><button class="btn" id="prev">← Previous</button><button class="btn" id="again">Study again</button><button class="btn primary" id="know">I know this</button><button class="btn" id="next">Next →</button></div><div class="flash-controls"><button class="btn small" id="shuffle">↻ Shuffle</button><a class="btn small" href="aphg-quiz.html">⚡ Quiz mode</a></div></div></main><div data-footer></div></div><script src="data.js"></script><script src="app.js"></script><script>
let deck=APHG_TERMS.map((x,i)=>({...x,id:i})),index=0;const mastered=new Set,review=new Set,card=document.querySelector("#flashcard");function render(){const x=deck[index];card.classList.remove("flipped");document.querySelector("#cardLabel").textContent=`Term ${index+1}`;document.querySelector("#cardTerm").textContent=x.term;document.querySelector("#cardDefinition").textContent=x.definition;document.querySelector("#cardExample").textContent=`Example: ${x.example}`;document.querySelector("#cardHook").textContent=`Memory hook: ${x.hook}`;document.querySelector("#progress").textContent=`${index+1} / ${deck.length}`;document.querySelector("#mastered").textContent=mastered.size;document.querySelector("#review").textContent=review.size;document.querySelector("#remaining").textContent=deck.length-new Set([...mastered,...review]).size}function move(n){index=(index+n+deck.length)%deck.length;render()}card.onclick=()=>card.classList.toggle("flipped");document.querySelector("#prev").onclick=()=>move(-1);document.querySelector("#next").onclick=()=>move(1);document.querySelector("#know").onclick=()=>{mastered.add(deck[index].id);review.delete(deck[index].id);move(1)};document.querySelector("#again").onclick=()=>{review.add(deck[index].id);mastered.delete(deck[index].id);move(1)};document.querySelector("#shuffle").onclick=()=>{for(let i=deck.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;render()};render();
</script></body></html>
