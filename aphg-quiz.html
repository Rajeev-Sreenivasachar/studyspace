<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APHG Unit 1 Practice Quiz | StudySpace</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div data-nav data-back="aphg.html"></div><main id="main"><header class="page-head"><div class="eyebrow">AP Human Geography • Unit 1</div><h1>Practice <span class="gradient-text">Quiz</span></h1><p class="lead">Ten random questions. Choose the term that matches each definition and get feedback right away.</p></header><div class="quiz-shell" id="quizShell"></div></main><div data-footer></div></div><script src="data.js"></script><script src="app.js"></script><script>
let questions=[],current=0,score=0,answered=false;const shell=document.querySelector("#quizShell");const shuffle=a=>{const b=[...a];for(let i=b.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function startQuiz(){questions=shuffle(APHG_TERMS).slice(0,10).map(correct=>({correct,choices:shuffle([correct,...shuffle(APHG_TERMS.filter(x=>x!==correct)).slice(0,3)])}));current=score=0;render()}function render(){answered=false;const q=questions[current];shell.innerHTML=`<div class="quiz-card"><div class="quiz-top"><span>Question ${current+1} of 10</span><strong>Score: ${score}</strong></div><div class="eyebrow">Which term matches?</div><h2>${q.correct.definition}</h2><div class="choices">${q.choices.map((x,i)=>`<button class="btn choice" data-i="${i}">${x.term}</button>`).join("")}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn primary" id="continue" hidden>${current===9?"See results":"Next question →"}</button></div>`;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.querySelector("#continue").onclick=()=>{current++;current===10?finish():render()}}function answer(i){if(answered)return;answered=true;const q=questions[current],picked=q.choices[i],ok=picked===q.correct;if(ok)score++;document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});const f=document.querySelector("#feedback");f.className=`feedback ${ok?"good":"bad"}`;f.textContent=ok?"Correct — nice work!":`Not quite. The answer is ${q.correct.term}.`;document.querySelector("#continue").hidden=false}function finish(){const pct=score*10;shell.innerHTML=`<div class="quiz-card empty-state"><div class="eyebrow">Quiz complete</div><h2>${score} / 10</h2><p class="lead">${pct>=80?"Strong work—you know this set.":pct>=60?"Good progress. Review the misses and try once more.":"Keep going. A quick flashcard round will help."}</p><div class="actions" style="justify-content:center"><button class="btn primary" id="retry">Retry with new questions</button><a class="btn" href="aphg-flashcards.html">Review flashcards</a></div></div>`;document.querySelector("#retry").onclick=startQuiz}startQuiz();
</script></body></html>
